name: Build NuGet package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for NuGet Trusted Publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # dotnet pack drives the publish step for every RuntimeIdentifier itself
      # (needed here since the project is a self-contained, multi-RID dotnet tool) -
      # a separate `dotnet build` first isn't sufficient input for it.
      # On a v* tag, the tag drives PackageVersion so tagging is the only release step.
      - name: Pack
        shell: bash
        run: |
          VERSION_ARG=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_ARG="-p:PackageVersion=${GITHUB_REF#refs/tags/v}"
          fi
          dotnet pack --configuration Release --no-restore --output ./artifacts $VERSION_ARG

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
          if-no-files-found: error

      - name: NuGet login (OIDC -> temp API key)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --skip-duplicate
